[workspace]
resolver = "2"
members = [
    "crates/syntropctl-core",
    "crates/syntropctl-cli",
    "qa/unit",
    "qa/edge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Syntropd Team"]
license = "Apache-2.0"
repository = "https://github.com/syntropd/syntropctl"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
